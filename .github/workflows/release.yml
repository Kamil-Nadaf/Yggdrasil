name: Release Yggdrasil

run-name: Yggdrasil ${{ github.ref_name }} — build installers & publish release

# Builds Yggdrasil natively on macOS, Windows and Linux (cross-compiling isn't
# supported — see packaging/DESKTOP.md) and attaches the installers to a GitHub
# Release so users download the one for their OS instead of building it.
#
# Cut a release:   git tag v0.3.0 && git push origin v0.3.0
# Test the build:  Actions tab → "Release Yggdrasil" → Run workflow
#                  (uploads the installers as workflow artifacts, no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-15
            artifact: mac-arm64
            paths: |
              release/Yggdrasil-*-mac-arm64.dmg
              release/Yggdrasil-*-mac-arm64.pkg
          - label: macOS (Intel)
            os: macos-15-intel
            artifact: mac-intel
            paths: |
              release/Yggdrasil-*-mac-intel.dmg
              release/Yggdrasil-*-mac-intel.pkg
          - label: Windows
            os: windows-latest
            artifact: windows
            paths: |
              release/Yggdrasil-*-windows.zip
          - label: Linux
            os: ubuntu-22.04
            artifact: linux
            paths: |
              release/Yggdrasil-*-linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/assistant/frontend/package-lock.json

      - name: Install uv (pip, avoids GitHub release download)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            python3 -m pip install --break-system-packages uv 2>/dev/null || python3 -m pip install uv && break
            echo "pip install uv failed (attempt $i), retrying..."; sleep 10
          done
          uv --version

      - name: Cache standalone Python (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: /tmp/ygg-py-cache-*
          key: pbs-${{ matrix.artifact }}-3.12.5-20240814

      - name: Linux build dependencies (PyGObject / GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config python3-dev libcairo2-dev libgirepository1.0-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/build-macos-app.sh

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/build-linux.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1

      # Regression guard: the bundled Python must keep working after it is moved
      # to a different folder (this is what a user's machine looks like). A venv
      # with hard-coded build paths fails this check.
      - name: Smoke test (relocated bundle)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R release/Yggdrasil.app "$RUNNER_TEMP/Moved.app"
            PY="$RUNNER_TEMP/Moved.app/Contents/Resources/python/bin/python3"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cp -R release/Yggdrasil-linux "$RUNNER_TEMP/moved"
            PY="$RUNNER_TEMP/moved/python/bin/python3"
          else
            cp -R release/Yggdrasil-windows "$RUNNER_TEMP/moved"
            PY="$RUNNER_TEMP/moved/python/python.exe"
          fi
          "$PY" -c "import fastapi, uvicorn, lancedb, pyarrow; print('relocated bundle OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  payload:
    name: Build in-app update package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/assistant/frontend/package-lock.json
      - name: Build frontend
        working-directory: services/assistant/frontend
        run: |
          npm ci
          npm run build
      - name: Package update
        run: bash scripts/make-update-payload.sh
      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(sed -n 's/^APP_VERSION = "\([^"]*\)".*/\1/p' services/assistant/data_manifest.py)
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != APP_VERSION v$V"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-update-payload
          path: release/Yggdrasil-app-v*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build web app
        working-directory: mobile
        run: |
          npm ci
          npm run build
      - name: Generate Android project (Capacitor)
        working-directory: mobile
        run: |
          npm i --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/browser@6
          npx cap add android
          bash scripts/android-icons.sh
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          V="${GITHUB_REF_NAME}"
          case "$V" in v*) ;; *) V="dev-${GITHUB_SHA::7}" ;; esac
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "release/Yggdrasil-${V#v}-android.apk"
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-android
          path: release/Yggdrasil-*-android.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, payload, android]
    # Publish even when one platform build fails (e.g. a runner that GitHub can't provision),
    # as long as the in-app update package built - that is what "Check for updates" installs.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.payload.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | Your OS | File |
            |---|---|
            | macOS, Apple Silicon (M1/M2/M3/M4) | `Yggdrasil-*-mac-arm64.pkg` or `.dmg` |
            | macOS, Intel | `Yggdrasil-*-mac-intel.pkg` or `.dmg` |
            | Windows | `Yggdrasil-*-windows.zip` → unzip → double-click `Yggdrasil.bat` |
            | Linux | `Yggdrasil-*-linux.tar.gz` → extract → `./install.sh` |
            | Android | `Yggdrasil-*-android.apk` → open on the phone (allow installs from this source). Needs the phone server from `mobile/` running on your Mac/server — see [mobile/README.md](https://github.com/${{ github.repository }}/blob/main/mobile/README.md) |

            Already installed? Open **Settings → Updates → Check for updates** — most releases
            install in-app (`Yggdrasil-app-*.zip`), no download needed.

            The apps are not code-signed. On macOS, if Gatekeeper blocks the DMG
            build, right-click → Open, or run `xattr -cr /Applications/Yggdrasil.app`.
            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md).
