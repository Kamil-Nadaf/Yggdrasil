services:
  arxiv-daily:
    build:
      context: ./services/arxiv-daily
      dockerfile: Dockerfile
    container_name: yggdrasil-arxiv-daily
    environment:
      VAULT_PATH: /vault
      ARXIV_QUERY: ${ARXIV_QUERY:-cat:astro-ph.HE}
      KEYWORDS: ${KEYWORDS:-GRB,gamma-ray burst,prompt emission,internal shock,afterglow,magnetar}
      AUTHOR_WATCH: ${AUTHOR_WATCH:-Zhang,Burgess,Iyyani,Ravasio,Beniamini,Pe'er}
      CRON_TIME: ${CRON_TIME:-06:30}
      MAX_RESULTS: ${MAX_RESULTS:-40}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${VAULT_HOST_PATH}
        target: /vault
    restart: unless-stopped

  indexer:
    build:
      context: ./services/indexer
      dockerfile: Dockerfile
    container_name: yggdrasil-indexer
    environment:
      VAULT_PATH: /vault
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${VAULT_HOST_PATH}
        target: /vault
        read_only: true
      - lancedb_data:/data/lancedb
    restart: unless-stopped

  assistant:
    build:
      context: ./services/assistant
      dockerfile: Dockerfile
    container_name: yggdrasil-assistant
    ports:
      - "8000:8000"
    environment:
      VAULT_PATH: /vault
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      ZOTERO_USER_ID: ${ZOTERO_USER_ID:-}
      ZOTERO_API_KEY: ${ZOTERO_API_KEY:-}
      GATE_CHECK: ${GATE_CHECK:-true}
      LATEX_URL: ${LATEX_URL:-http://latex:9000}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${VAULT_HOST_PATH}
        target: /vault
      - lancedb_data:/data/lancedb
    restart: unless-stopped

  latex:
    build:
      context: ./services/latex
      dockerfile: Dockerfile
    container_name: yggdrasil-latex
    environment:
      VAULT_PATH: /vault
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${VAULT_HOST_PATH}
        target: /vault
    expose:
      - "9000"
    restart: unless-stopped

volumes:
  lancedb_data:
